name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Covers the client and the Worker: `worker/` is a separate TypeScript program,
      # because the Workers runtime globals collide with the DOM library.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Publishing happens from reviewed source, never from a working copy, and only after the
  # checks above have passed on it (design D50). A pull request therefore runs `check` and
  # publishes nothing — a red build cannot become the app a lesson is running on.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The token and the account id are repository secrets: this repository is public,
      # and neither belongs in it (design D50).
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
