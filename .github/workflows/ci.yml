name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Covers the client and the Worker: `worker/` is a separate TypeScript program,
      # because the Workers runtime globals collide with the DOM library.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Publishing happens from reviewed source, never from a working copy, and only after the
  # checks above have passed on it (design D50). A pull request therefore runs `check` and
  # publishes nothing — a red build cannot become the app a lesson is running on.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The whole history, because the version the app shows is how many commits are
      # behind it (design D57). A default checkout fetches one commit, and the build would
      # then publish `-unknown` — the honest fallback, and the wrong answer here.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The token and the account id are repository secrets: this repository is public,
      # and neither belongs in it (design D50). Nothing here writes back to the repository
      # and nothing is tagged — the version is derived, not recorded (D-26).
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
